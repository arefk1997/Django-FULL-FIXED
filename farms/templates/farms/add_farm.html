{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

<div class="max-w-6xl mx-auto p-4 md:p-8 bg-white shadow-2xl rounded-3xl mt-6 border border-gray-100">
    <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-right">
            <h2 class="text-3xl font-black text-green-800">ثبت و ترسیم محدوده مزرعه</h2>
            <p class="text-gray-500 text-sm mt-1">مرز دقیق زمین را روی نقشه ماهواره‌ای مشخص کنید.</p>
        </div>
        <div class="flex items-center gap-2 bg-green-50 px-4 py-2 rounded-2xl border border-green-100">
            <span class="text-green-600 font-bold text-xs uppercase">Location: {{ user_region.city.name }}</span>
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
            </span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="bg-gray-50 p-4 rounded-2xl border border-dashed border-gray-200">
            <label class="block text-xs text-gray-400 mb-1">استان محل فعالیت (سیستمی)</label>
            <p class="font-bold text-gray-700">{{ user_region.province.name|default:"ثبت نشده" }}</p>
        </div>
        <div class="bg-gray-50 p-4 rounded-2xl border border-dashed border-gray-200">
            <label class="block text-xs text-gray-400 mb-1">شهرستان محل فعالیت (سیستمی)</label>
            <p class="font-bold text-gray-700">{{ user_region.city.name|default:"ثبت نشده" }}</p>
        </div>
    </div>

    <div id="map" class="h-[500px] rounded-3xl border-8 border-gray-50 shadow-inner z-10"></div>

    <form method="POST" class="mt-8" id="farm-form">
        {% csrf_token %}
        <input type="hidden" id="boundary_data" name="boundary_data">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
            <div class="md:col-span-2">
                <label class="block text-gray-700 font-bold mb-2 text-sm">نام قطعه زمین / مزرعه:</label>
                <input type="text" name="name" required
                       placeholder="مثلاً: زمین شماره ۱ - بخش شمالی"
                       class="w-full p-4 border-2 border-gray-100 rounded-2xl focus:border-green-500 outline-none transition-all shadow-sm">
            </div>

            <div>
                <button type="submit"
                        class="w-full bg-green-600 text-white px-6 py-4 rounded-2xl font-black hover:bg-green-700 transition transform hover:-translate-y-1 shadow-xl shadow-green-100">
                    تایید و ثبت نهایی مزرعه
                </button>
            </div>
        </div>
    </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
    // ۱. تنظیم اولیه نقشه (زوم روی ایران به صورت پیش‌فرض)
    var map = L.map('map').setView([32.4279, 53.6880], 5);

    // ۲. لایه ماهواره‌ای ترکیبی (گوگل)
    // توجه: تایل مستقیم google.com/vt مشمول شرایط استفاده‌ی رسمی گوگل نیست؛ برای production از Google Maps Platform (با API Key) یا جایگزینی مثل Mapbox/MapTiler استفاده کنید.
L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains:['mt0','mt1','mt2','mt3'],
        attribution: 'Google Satellite'
    }).addTo(map);

    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // ۳. ابزارهای ترسیم (فقط پلی‌گون فعال است)
    var drawControl = new L.Control.Draw({
        draw: {
            polygon: {
                allowIntersection: false,
                showArea: true,
                drawError: { color: '#ef4444', message: 'خطوط نباید همدیگر را قطع کنند!' },
                shapeOptions: { color: '#059669', fillOpacity: 0.5, weight: 3 }
            },
            polyline: false, circle: false, rectangle: false, marker: false, circlemarker: false
        },
        edit: { featureGroup: drawnItems, remove: true }
    });
    map.addControl(drawControl);

    // ۴. مدیریت ذخیره‌سازی ترسیم
    map.on(L.Draw.Event.CREATED, function (event) {
        var layer = event.layer;
        drawnItems.clearLayers(); // فقط یک مزرعه در هر بار ثبت
        drawnItems.addLayer(layer);

        var data = layer.toGeoJSON();
        document.getElementById('boundary_data').value = JSON.stringify(data.geometry);
    });

    // ۵. اعتبارسنجی قبل از ارسال فرم
    document.getElementById('farm-form').onsubmit = function(e) {
        if (!document.getElementById('boundary_data').value) {
            e.preventDefault();
            alert("لطفاً ابتدا محدوده زمین را روی نقشه ترسیم کنید.");
        }
    };
</script>
{% endblock %}
