<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ survey.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        /* استایل سفارشی برای زیباتر شدن دکمه‌های رادیویی داینامیک */
        input[type="radio"] {
            margin-left: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-10">
    <div class="max-w-2xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden border border-gray-100">

        <div class="bg-gradient-to-r from-green-600 to-green-500 p-8">
            <h2 class="text-white text-2xl font-black text-center">{{ survey.title }}</h2>
            {% if survey.description %}
                <p class="text-green-50 text-center mt-2 text-sm">{{ survey.description }}</p>
            {% endif %}
        </div>

        <form method="post" class="p-8 space-y-6">
            {% csrf_token %}

            {% for field in form %}
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 hover:border-green-200 transition-colors">
                    <label class="block text-gray-800 font-bold mb-3 text-sm md:text-base">
                        {{ field.label }}
                        {% if field.field.required %}
                            <span class="text-red-500 mr-1">*</span>
                        {% endif %}
                    </label>

                    <div class="survey-field">
                        {{ field }}
                    </div>

                    {% if field.help_text %}
                        <p class="text-gray-400 text-xs mt-2">{{ field.help_text }}</p>
                    {% endif %}

                    {% if field.errors %}
                        <div class="mt-2 bg-red-50 p-2 rounded-lg border border-red-100">
                            <p class="text-red-600 text-xs font-bold">{{ field.errors.0 }}</p>
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="pt-4">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-green-200 transition-all transform active:scale-95">
                    ثبت نهایی و ارسال پاسخ‌ها
                </button>
                <a href="{% url 'dashboard' %}" class="block text-center mt-4 text-gray-400 text-sm hover:text-gray-600">
                    انصراف و بازگشت
                </a>
            </div>
        </form>
    </div>
</body>
</html>
