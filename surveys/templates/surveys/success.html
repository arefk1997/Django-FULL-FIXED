<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت موفقیت‌آمیز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-sm w-full text-center border border-gray-100">
        <div class="bg-green-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
            <div class="text-green-600 text-5xl font-bold">✓</div>
        </div>

        <h2 class="text-2xl font-black text-gray-800">اطلاعات با موفقیت ثبت شد</h2>
        <p class="text-gray-500 mt-3 leading-relaxed">
            ممنون از همکاری شما کشاورز گرامی. پاسخ‌های شما در سیستم ذخیره گردید.
        </p>

        <div class="mt-8 space-y-3">
            <a href="{% url 'dashboard' %}"
               class="block w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition duration-300 shadow-lg shadow-blue-200">
                بازگشت به میز کار
            </a>
            <p class="text-xs text-gray-400">سامانه هوشمند مدیریت کشاورزی</p>
        </div>
    </div>
</body>
</html>
